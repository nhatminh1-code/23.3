<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Thanh toan')}"></head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
            <li class="breadcrumb-item">
                <a th:href="@{/cart}">Gio hang</a>
            </li>
            <li class="breadcrumb-item active">Thanh toan</li>
        </ol>
    </nav>

    <h3><i class="bi bi-credit-card"></i> Thanh toan don hang</h3>

    <div class="row mt-4">
        <!-- Customer Info Form -->
        <div class="col-md-7">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-person"></i> Thong tin khach hang
                    </h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/checkout/place-order}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Ho va ten
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control"
                                   name="customerName" required
                                   placeholder="Nhap ho va ten">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Email
                                <span class="text-danger">*</span>
                            </label>
                            <input type="email" class="form-control"
                                   name="customerEmail" required
                                   placeholder="Nhap email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                So dien thoai
                                <span class="text-danger">*</span>
                            </label>
                            <input type="tel" class="form-control"
                                   name="customerPhone" required
                                   placeholder="Nhap so dien thoai">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Dia chi giao hang
                                <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control"
                                      name="customerAddress" rows="3"
                                      required
                                      placeholder="Nhap dia chi giao hang">
                            </textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit"
                                    class="btn btn-success btn-lg">
                                <i class="bi bi-bag-check"></i> Dat hang
                            </button>
                            <a th:href="@{/cart}"
                               class="btn btn-secondary btn-lg">
                                <i class="bi bi-arrow-left"></i> Quay lai
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Order Summary -->
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-receipt"></i> Tom tat don hang
                    </h5>
                </div>
                <div class="card-body">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>San pham</th>
                                <th class="text-center">SL</th>
                                <th class="text-end">Thanh tien</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cartItems}">
                                <td th:text="${item.productName}">Product</td>
                                <td class="text-center"
                                    th:text="${item.quantity}">1</td>
                                <td class="text-end"
                                    th:text="${item.subtotal}">0</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr class="table-warning">
                                <td colspan="2" class="fw-bold">
                                    TONG CONG:
                                </td>
                                <td class="text-end fw-bold text-danger fs-5"
                                    th:text="${totalAmount}">0</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

<footer th:replace="~{fragments :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
