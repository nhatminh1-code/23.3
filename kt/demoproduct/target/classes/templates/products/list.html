<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Danh sach san pham')}"></head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
            <li class="breadcrumb-item active">Products</li>
        </ol>
    </nav>

    <!-- Messages -->
    <div th:if="${message}"
         class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- SEARCH + FILTER + SORT BAR -->
    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/products}" method="get"
                  class="row g-2 align-items-end">

                <!-- Câu 1: Search -->
                <div class="col-md-4">
                    <label class="form-label fw-bold">
                        <i class="bi bi-search"></i> Tim kiem
                    </label>
                    <input type="text" class="form-control" name="keyword"
                           th:value="${keyword}"
                           placeholder="Nhap ten san pham...">
                </div>

                <!-- Câu 4: Filter by Category -->
                <div class="col-md-3">
                    <label class="form-label fw-bold">
                        <i class="bi bi-funnel"></i> Danh muc
                    </label>
                    <select class="form-select" name="categoryId">
                        <option value="">-- Tat ca --</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:selected="${categoryId != null and categoryId == cat.id}">
                        </option>
                    </select>
                </div>

                <!-- Câu 3: Sort -->
                <div class="col-md-3">
                    <label class="form-label fw-bold">
                        <i class="bi bi-sort-down"></i> Sap xep
                    </label>
                    <select class="form-select" name="sortField">
                        <option value="id"
                                th:selected="${sortField == 'id'}">Mac dinh</option>
                        <option value="name"
                                th:selected="${sortField == 'name'}">Theo ten</option>
                        <option value="price"
                                th:selected="${sortField == 'price'}">Theo gia</option>
                    </select>
                </div>

                <div class="col-md-2 d-flex gap-1">
                    <input type="hidden" name="sortDir" th:value="${sortDir}">
                    <input type="hidden" name="page" value="0">
                    <button type="submit" class="btn btn-primary flex-grow-1">
                        <i class="bi bi-search"></i> Loc
                    </button>
                </div>
            </form>

            <!-- Sort price buttons -->
            <div class="mt-2">
                <span class="me-2 fw-bold">Sap xep gia:</span>
                <a th:href="@{/products(keyword=${keyword},
                   categoryId=${categoryId},
                   page=0, sortField='price', sortDir='asc')}"
                   class="btn btn-sm btn-outline-success">
                    <i class="bi bi-sort-numeric-up"></i> Gia tang dan
                </a>
                <a th:href="@{/products(keyword=${keyword},
                   categoryId=${categoryId},
                   page=0, sortField='price', sortDir='desc')}"
                   class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-sort-numeric-down-alt"></i> Gia giam dan
                </a>
                <a th:href="@{/products}"
                   class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-x-circle"></i> Xoa bo loc
                </a>
            </div>
        </div>
    </div>

    <!-- Create button -->
    <a th:href="@{/products/create}" class="btn btn-success mb-3">
        <i class="bi bi-plus-circle"></i> Create New Product
    </a>

    <!-- Info -->
    <p class="text-muted">
        Tong: <strong th:text="${totalItems}">0</strong> san pham
        | Trang <strong th:text="${currentPage + 1}">1</strong> /
        <strong th:text="${totalPages > 0 ? totalPages : 1}">1</strong>
    </p>

    <!-- PRODUCT TABLE -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Image</th>
                    <th>Price</th>
                    <th>Category Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product, iter : ${products}">
                    <td th:text="${currentPage * 5 + iter.count}">1</td>
                    <td th:text="${product.name}">Product Name</td>
                    <td>
                        <img th:if="${product.image != null and !product.image.isEmpty()}"
                             th:src="@{'/uploads/' + ${product.image}}"
                             class="product-img" alt="Product Image">
                        <span th:if="${product.image == null or product.image.isEmpty()}"
                              class="text-muted">No image</span>
                    </td>
                    <td th:text="${product.price}">0</td>
                    <td th:text="${product.category != null
                                  ? product.category.name : 'N/A'}">
                        Category
                    </td>
                    <td>
                        <a th:href="@{/products/edit/{id}(id=${product.id})}"
                           class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <a th:href="@{/products/delete/{id}(id=${product.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Ban co chac muon xoa?')">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                        <!-- Câu 5: Add to Cart -->
                        <form th:action="@{/cart/add}" method="post"
                              class="d-inline">
                            <input type="hidden" name="productId"
                                   th:value="${product.id}">
                            <input type="hidden" name="quantity" value="1">
                            <button type="submit"
                                    class="btn btn-sm btn-info">
                                <i class="bi bi-cart-plus"></i> Add to Cart
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                        <p>Khong tim thay san pham nao</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Câu 2: PAGINATION -->
    <nav th:if="${totalPages > 1}" aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <!-- Previous -->
            <li class="page-item"
                th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/products(keyword=${keyword},
                   categoryId=${categoryId},
                   page=${currentPage - 1},
                   sortField=${sortField},
                   sortDir=${sortDir})}">
                    <i class="bi bi-chevron-left"></i> Previous
                </a>
            </li>

            <!-- Page Numbers -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/products(keyword=${keyword},
                   categoryId=${categoryId},
                   page=${i},
                   sortField=${sortField},
                   sortDir=${sortDir})}"
                   th:text="${i + 1}">1</a>
            </li>

            <!-- Next -->
            <li class="page-item"
                th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/products(keyword=${keyword},
                   categoryId=${categoryId},
                   page=${currentPage + 1},
                   sortField=${sortField},
                   sortDir=${sortDir})}">
                    Next <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>

</div>

<footer th:replace="~{fragments :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
