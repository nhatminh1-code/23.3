<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Tao san pham moi')}"></head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
            <li class="breadcrumb-item">
                <a th:href="@{/products}">Products</a>
            </li>
            <li class="breadcrumb-item active">Create</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-plus-circle"></i> Tao san pham moi
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/products/save}" method="post"
                          enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Ten san pham
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control"
                                   name="name" required
                                   placeholder="Nhap ten san pham">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Gia <span class="text-danger">*</span>
                            </label>
                            <input type="number" class="form-control"
                                   name="price" required
                                   step="0.01" min="0"
                                   placeholder="Nhap gia san pham">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Danh muc
                                <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" name="categoryId"
                                    required>
                                <option value="">-- Chon danh muc --</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Hinh anh</label>
                            <input type="file" class="form-control"
                                   name="imageFile" accept="image/*">
                            <div class="form-text">
                                Chap nhan: JPG, PNG, GIF (toi da 10MB)
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle"></i> Luu
                            </button>
                            <a th:href="@{/products}"
                               class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Quay lai
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
