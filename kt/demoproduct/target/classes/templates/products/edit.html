<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Chinh sua san pham')}"></head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
            <li class="breadcrumb-item">
                <a th:href="@{/products}">Products</a>
            </li>
            <li class="breadcrumb-item active">Edit</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-warning">
                    <h4 class="mb-0">
                        <i class="bi bi-pencil-square"></i> Chinh sua san pham
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/products/update/{id}(id=${product.id})}"
                          method="post" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Ten san pham
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control"
                                   name="name" required
                                   th:value="${product.name}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Gia <span class="text-danger">*</span>
                            </label>
                            <input type="number" class="form-control"
                                   name="price" required
                                   step="0.01" min="0"
                                   th:value="${product.price}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Danh muc
                                <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" name="categoryId"
                                    required>
                                <option value="">-- Chon danh muc --</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}"
                                        th:selected="${product.category != null
                                        and product.category.id == cat.id}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Hinh anh hien tai
                            </label>
                            <div th:if="${product.image != null
                                         and !product.image.isEmpty()}">
                                <img th:src="@{'/uploads/' + ${product.image}}"
                                     style="max-width: 200px; max-height: 150px;"
                                     class="rounded border mb-2"
                                     alt="Current Image">
                            </div>
                            <div th:if="${product.image == null
                                         or product.image.isEmpty()}"
                                 class="text-muted mb-2">
                                Chua co anh
                            </div>
                            <label class="form-label">
                                Tai anh moi (de trong neu giu anh cu)
                            </label>
                            <input type="file" class="form-control"
                                   name="imageFile" accept="image/*">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-check-circle"></i> Cap nhat
                            </button>
                            <a th:href="@{/products}"
                               class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Quay lai
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
