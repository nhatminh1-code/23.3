<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- HEAD -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Demo Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
        footer { background-color: #343a40; color: white;
                 padding: 15px 0; margin-top: 40px; }
        .product-img { width: 80px; height: 60px;
                       object-fit: cover; border-radius: 4px; }
        .cart-badge { position: relative; top: -8px; font-size: 0.7em; }
    </style>
</head>

<!-- NAVBAR -->
<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-shop"></i> DemoProduct
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}">Products</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/cart}">
                        <i class="bi bi-cart3"></i> Gio hang
                        <span class="badge bg-danger cart-badge"
                              th:if="${session.cart != null and not session.cart.isEmpty()}"
                              th:text="${session.cart.size()}">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- FOOTER -->
<footer th:fragment="footer">
    <div class="container text-center">
        <p class="mb-0">&copy; 2025 - Phat trien ung dung voi J2EE</p>
    </div>
</footer>

</html>
