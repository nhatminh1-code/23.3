<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Gio hang')}"></head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
            <li class="breadcrumb-item active">Gio hang</li>
        </ol>
    </nav>

    <h3><i class="bi bi-cart3"></i> Gio hang cua ban</h3>

    <!-- Messages -->
    <div th:if="${message}"
         class="alert alert-success alert-dismissible fade show">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert">
        </button>
    </div>
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert">
        </button>
    </div>

    <!-- Empty cart -->
    <div th:if="${#lists.isEmpty(cartItems)}" class="text-center py-5">
        <i class="bi bi-cart-x" style="font-size: 4rem; color: #ccc;"></i>
        <h4 class="text-muted mt-3">Gio hang trong</h4>
        <a th:href="@{/products}" class="btn btn-primary mt-2">
            <i class="bi bi-arrow-left"></i> Tiep tuc mua sam
        </a>
    </div>

    <!-- Cart table -->
    <div th:if="${!#lists.isEmpty(cartItems)}">
        <div class="table-responsive">
            <table class="table table-bordered table-hover bg-white">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Hinh anh</th>
                        <th>Ten san pham</th>
                        <th>Gia</th>
                        <th>So luong</th>
                        <th>Tong tien</th>
                        <th>Thao tac</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item, iter : ${cartItems}">
                        <td th:text="${iter.count}">1</td>
                        <td>
                            <img th:if="${item.productImage != null
                                         and !item.productImage.isEmpty()}"
                                 th:src="@{'/uploads/' + ${item.productImage}}"
                                 class="product-img" alt="Product">
                            <span th:if="${item.productImage == null
                                          or item.productImage.isEmpty()}"
                                  class="text-muted">No image</span>
                        </td>
                        <td th:text="${item.productName}">Product Name</td>
                        <td th:text="${item.price}">0</td>
                        <td>
                            <form th:action="@{/cart/update}" method="post"
                                  class="d-flex gap-1"
                                  style="max-width: 150px;">
                                <input type="hidden" name="productId"
                                       th:value="${item.productId}">
                                <input type="number"
                                       class="form-control form-control-sm"
                                       name="quantity"
                                       th:value="${item.quantity}"
                                       min="1" style="width: 70px;">
                                <button type="submit"
                                        class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </button>
                            </form>
                        </td>
                        <td class="fw-bold text-success"
                            th:text="${item.subtotal}">0</td>
                        <td>
                            <a th:href="@{/cart/remove/{id}(id=${item.productId})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Xoa san pham nay?')">
                                <i class="bi bi-trash"></i> Xoa
                            </a>
                        </td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="table-warning">
                        <td colspan="5"
                            class="text-end fw-bold fs-5">TONG CONG:</td>
                        <td class="fw-bold fs-5 text-danger"
                            th:text="${totalAmount}">0</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="d-flex justify-content-between mt-3">
            <div>
                <a th:href="@{/products}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Tiep tuc mua sam
                </a>
                <a th:href="@{/cart/clear}"
                   class="btn btn-outline-danger"
                   onclick="return confirm('Xoa toan bo gio hang?')">
                    <i class="bi bi-trash"></i> Xoa gio hang
                </a>
            </div>
            <a th:href="@{/checkout}" class="btn btn-success btn-lg">
                <i class="bi bi-credit-card"></i> Thanh toan
            </a>
        </div>
    </div>

</div>

<footer th:replace="~{fragments :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
