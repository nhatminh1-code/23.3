<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Xac nhan don hang')}"></head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- Success message -->
            <div class="text-center py-4">
                <i class="bi bi-check-circle-fill text-success"
                   style="font-size: 5rem;"></i>
                <h2 class="text-success mt-3">Dat hang thanh cong!</h2>
                <p class="text-muted">
                    Cam on ban da dat hang.
                    Don hang cua ban dang duoc xu ly.
                </p>
            </div>

            <!-- Order details -->
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-receipt"></i>
                        Don hang #<span th:text="${order.id}">0</span>
                    </h5>
                </div>
                <div class="card-body">
                    <!-- Customer info -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <strong>Khach hang:</strong>
                            <span th:text="${order.customerName}">Name</span>
                        </div>
                        <div class="col-md-6">
                            <strong>Email:</strong>
                            <span th:text="${order.customerEmail}">
                                email
                            </span>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <strong>Dien thoai:</strong>
                            <span th:text="${order.customerPhone}">
                                phone
                            </span>
                        </div>
                        <div class="col-md-6">
                            <strong>Ngay dat:</strong>
                            <span th:text="${#temporals.format(
                                  order.orderDate,
                                  'dd/MM/yyyy HH:mm')}">date</span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <strong>Dia chi:</strong>
                        <span th:text="${order.customerAddress}">
                            address
                        </span>
                    </div>

                    <hr>

                    <!-- Order items -->
                    <h6 class="fw-bold">Chi tiet don hang:</h6>
                    <table class="table table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>San pham</th>
                                <th class="text-center">Gia</th>
                                <th class="text-center">So luong</th>
                                <th class="text-end">Thanh tien</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="detail, iter
                                         : ${order.orderDetails}">
                                <td th:text="${iter.count}">1</td>
                                <td th:text="${detail.product.name}">
                                    Product
                                </td>
                                <td class="text-center"
                                    th:text="${detail.price}">0</td>
                                <td class="text-center"
                                    th:text="${detail.quantity}">1</td>
                                <td class="text-end"
                                    th:text="${detail.subtotal}">0</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr class="table-warning">
                                <td colspan="4"
                                    class="text-end fw-bold fs-5">
                                    TONG CONG:
                                </td>
                                <td class="text-end fw-bold text-danger fs-5"
                                    th:text="${order.totalAmount}">0</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <div class="text-center mt-4">
                <a th:href="@{/products}"
                   class="btn btn-primary btn-lg">
                    <i class="bi bi-arrow-left"></i> Tiep tuc mua sam
                </a>
            </div>

        </div>
    </div>

</div>

<footer th:replace="~{fragments :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
